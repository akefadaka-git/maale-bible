[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "maale-bible-api"
version = "0.1.0"
description = "Server-side API foundation for Maale Bible"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/maale_bible_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
