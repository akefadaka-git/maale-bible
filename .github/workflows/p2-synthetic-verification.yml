name: P2 synthetic verification
# Final consolidated verification candidate: exact branch HEAD is the test subject.
# Do not push further changes until this matrix completes.
on:
  pull_request:
    paths: ['app/**','verification/p2/**','verification/android/**','verification/canon/**','content/canon/**','content/manifests/**','gradle/wrapper/gradle-wrapper.properties','.github/workflows/p2-synthetic-verification.yml']
  push:
    branches: [feat/a4-offline-study-suite]
    paths: ['app/**','verification/p2/**','verification/android/**','verification/canon/**','content/canon/**','content/manifests/**','.github/workflows/p2-synthetic-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p2-synthetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python verification/canon/canonical_registry_verify.py
      - run: python verification/canon/maale_source_canon_reconcile.py
      - run: python verification/android/test_run_emulator_tests.py
      - run: python verification/p2/p2_verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: p2-host-evidence
          path: verification/p2/host-verification-results.json
  android-fts5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api: [26,28,30,33,35,36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          # Give recent API images enough guest RAM/CPU to avoid system_server
          # instability under the Ubuntu hosted-runner emulator workload.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data -memory 4096 -cores 2
          disable-animations: true
          emulator-boot-timeout: 900
          # This action splits script input on newlines; invoke the tracked script as ONE command.
          script: ANDROID_EXPECTED_API=${{ matrix.api }} sh verification/android/run-emulator-tests.sh
      - name: Upload emulator logs and instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api }}-evidence
          if-no-files-found: warn
          path: |
            app/build/ci-emulator-api-${{ matrix.api }}-attempt-*.log
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/debug/**

  debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Assemble phone-installable APK
        run: ./gradlew --no-daemon --max-workers=2 --console=plain :app:assembleDebug
      - name: Generate APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: maale-bible-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
