name: P2 synthetic verification
# Stable Android CI: prefetch verified AOSP system images and use a lean emulator profile.
on:
  pull_request:
    paths: ['app/**','verification/p2/**','verification/android/**','verification/canon/**','content/canon/**','content/manifests/**','gradle/wrapper/gradle-wrapper.properties','.github/workflows/p2-synthetic-verification.yml']
  push:
    branches: [feat/a4-offline-study-suite, fix/a2-remediation-complete]
    paths: ['app/**','verification/p2/**','verification/android/**','verification/canon/**','content/canon/**','content/manifests/**','.github/workflows/p2-synthetic-verification.yml']
  workflow_dispatch:
    inputs:
      full_android_matrix:
        description: "Run the full six-API Android emulator matrix"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: p2-synthetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python verification/canon/canonical_registry_verify.py
      - run: python verification/canon/maale_source_canon_reconcile.py
      - run: python verification/android/test_run_emulator_tests.py
      - run: python verification/p2/p2_verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: p2-host-evidence
          path: verification/p2/host-verification-results.json
  android-fts5:
    needs: [host-contracts, debug-apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # PR updates validate one API first; dispatch the full matrix explicitly.
        api: ${{ github.event_name == 'pull_request' && fromJSON('[30]') || ((inputs.full_android_matrix || (github.event_name == 'push' && github.ref_name == 'fix/a2-remediation-complete')) && fromJSON('[26,28,30,33,35,36]')) || fromJSON('[30]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Preinstall and verify Android SDK platform and emulator image
        shell: bash
        env:
          ANDROID_API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            echo "::error::Android sdkmanager not found under ${SDK_ROOT}"
            exit 1
          fi

          # Accept licences before installing legacy API packages (notably API 28).
          # yes may receive SIGPIPE after sdkmanager finishes; ignore only that
          # producer status, then restore strict pipeline handling for all installs.
          set +o pipefail
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null
          set -o pipefail

          platform="platforms;android-${ANDROID_API}"
          image="system-images;android-${ANDROID_API};default;x86_64"
          installed=false
          for attempt in 1 2 3; do
            echo "Installing ${platform} and ${image} (attempt ${attempt}/3)."
            if "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install "${platform}" "${image}"; then
              installed=true
              break
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "::warning::SDK archive/install failed; removing only partial API ${ANDROID_API} packages and transient download caches."
              rm -rf "${SDK_ROOT}/platforms/android-${ANDROID_API}"
              rm -rf "${SDK_ROOT}/system-images/android-${ANDROID_API}/default/x86_64"
              rm -rf "${SDK_ROOT}/.temp" "${SDK_ROOT}/temp" "${HOME}/.android/cache"
              sleep $((attempt * 15))
            fi
          done
          if [[ "${installed}" != true ]]; then
            echo "::error::Android API ${ANDROID_API} SDK packages could not be installed after three attempts."
            exit 1
          fi

          test -s "${SDK_ROOT}/platforms/android-${ANDROID_API}/source.properties"
          test -s "${SDK_ROOT}/system-images/android-${ANDROID_API}/default/x86_64/source.properties"
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --list_installed | grep -F "${platform}"
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --list_installed | grep -F "${image}"
          echo "Verified SDK platform and AOSP emulator image for API ${ANDROID_API}."

      - name: Enable KVM access for Android emulator
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
            echo "KVM is readable and writable by the hosted runner user."
          else
            echo "::warning::/dev/kvm is unavailable; emulator will use software acceleration."
          fi

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          # AOSP images avoid unnecessary Google Play services; 2 GiB leaves
          # sufficient host RAM for the emulator process on standard runners.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data -memory 2048 -cores 2
          disable-animations: true
          emulator-boot-timeout: 900
          # Invoke the tracked script as one command; the action splits multiline scripts.
          script: sh verification/android/run-emulator-tests.sh
        env:
          ANDROID_EXPECTED_API: ${{ matrix.api }}
          ANDROID_TEST_CLASS: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'fix/a2-remediation-complete')) && 'org.maale.bible.P2V6NavigationSmokeTest' || '' }}
      - name: Upload emulator logs and instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api }}-evidence
          if-no-files-found: warn
          path: |
            app/build/ci-emulator-api-${{ matrix.api }}-attempt-*.log
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/debug/**

  debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Assemble phone-installable APK
        run: ./gradlew --no-daemon --max-workers=2 --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Generate APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: maale-bible-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
