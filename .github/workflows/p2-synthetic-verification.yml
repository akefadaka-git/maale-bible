name: P2 synthetic verification
# Final consolidated verification candidate: exact branch HEAD is the test subject.
# Do not push further changes until this matrix completes.
on:
  pull_request:
    paths: ['app/**','verification/p2/**','verification/canon/**','content/canon/**','content/manifests/**','gradle/wrapper/gradle-wrapper.properties','.github/workflows/p2-synthetic-verification.yml']
  push:
    branches: [feat/a4-offline-study-suite]
    paths: ['app/**','verification/p2/**','verification/canon/**','content/canon/**','content/manifests/**','.github/workflows/p2-synthetic-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p2-synthetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python verification/canon/canonical_registry_verify.py
      - run: python verification/canon/maale_source_canon_reconcile.py
      - run: python verification/p2/p2_verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: p2-host-evidence
          path: verification/p2/host-verification-results.json
  android-fts5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26,28,30,33,35,36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -Eeuo pipefail
            expected_api="${{ matrix.api }}"

            diagnostics() {
              echo "::group::Android emulator diagnostics (API ${expected_api})"
              adb devices -l || true
              for prop in sys.boot_completed init.svc.bootanim ro.build.version.sdk ro.build.version.release; do
                echo "--- ${prop} ---"
                timeout 10s adb shell getprop "${prop}" 2>&1 || true
              done
              echo "--- emulator process ---"
              pgrep -af 'emulator|qemu' || true
              echo "--- recent logcat ---"
              timeout 20s adb logcat -b all -d -t 1500 2>&1 || true
              echo "::endgroup::"
            }

            on_error() {
              rc=$?
              echo "::error::Android verification failed on API ${expected_api}; collecting diagnostics."
              diagnostics
              exit "${rc}"
            }
            trap on_error ERR

            ready=false
            # Three bounded readiness attempts; each waits at most 180 seconds.
            for attempt in 1 2 3; do
              echo "Emulator readiness attempt ${attempt}/3 (API ${expected_api})"
              timeout 30s adb wait-for-device || true
              deadline=$((SECONDS + 180))
              while (( SECONDS < deadline )); do
                if [[ "$(timeout 8s adb get-state 2>/dev/null || true)" == "device" ]]; then
                  boot_completed="$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                  boot_animation="$(timeout 10s adb shell getprop init.svc.bootanim 2>/dev/null | tr -d '\r' || true)"
                  actual_api="$(timeout 10s adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r' || true)"
                  if [[ "${boot_completed}" == "1" && "${boot_animation}" == "stopped" && "${actual_api}" == "${expected_api}" ]]; then
                    ready=true
                    break
                  fi
                fi
                sleep 5
              done
              if [[ "${ready}" == "true" ]]; then
                break
              fi
              echo "::warning::Emulator did not become fully ready on attempt ${attempt}/3."
              diagnostics
              if (( attempt < 3 )); then
                adb reconnect offline || true
                adb kill-server || true
                adb start-server
                sleep 5
              fi
            done

            if [[ "${ready}" != "true" ]]; then
              echo "::error::Emulator failed boot-readiness checks after 3 attempts."
              exit 1
            fi

            echo "Emulator ready: API ${expected_api}; boot_completed=1; boot animation stopped."
            adb shell getprop ro.build.version.sdk
            adb shell pm path android >/dev/null
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
