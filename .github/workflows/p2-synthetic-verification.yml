name: P2 synthetic verification
# Final consolidated verification candidate: exact branch HEAD is the test subject.
# Do not push further changes until this matrix completes.
on:
  pull_request:
    paths: ['app/**','verification/p2/**','verification/canon/**','content/canon/**','content/manifests/**','gradle/wrapper/gradle-wrapper.properties','.github/workflows/p2-synthetic-verification.yml']
  push:
    branches: [feat/a4-offline-study-suite]
    paths: ['app/**','verification/p2/**','verification/canon/**','content/canon/**','content/manifests/**','.github/workflows/p2-synthetic-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p2-synthetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python verification/canon/canonical_registry_verify.py
      - run: python verification/canon/maale_source_canon_reconcile.py
      - run: python verification/p2/p2_verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: p2-host-evidence
          path: verification/p2/host-verification-results.json
  android-fts5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26,28,30,33,35,36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
