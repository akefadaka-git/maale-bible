name: A2 tooling tests
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'content/manifests/**'
      - '.github/workflows/a2-tooling-tests.yml'
  push:
    branches:
      - fix/a2-audit-manifest-book-id-regression
    paths:
      - 'tools/**'
      - 'content/manifests/**'
      - '.github/workflows/a2-tooling-tests.yml'
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic audit and archive preflight tests
        run: python -m unittest discover -s tools/tests -v
