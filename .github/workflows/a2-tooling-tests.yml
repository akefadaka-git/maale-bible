name: A2 source-readiness evidence tests

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'content/manifests/**'
      - 'docs/source-verification/**'
      - 'docs/licensing/**'
      - '.github/workflows/a2-tooling-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/**'
      - 'content/manifests/**'
      - 'docs/source-verification/**'
      - 'docs/licensing/**'
      - '.github/workflows/a2-tooling-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a2-source-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a2-evidence-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run A2 tooling and metadata-only baseline tests
        run: python -m unittest discover -s tools/tests -v
