name: Maale scripture importer validation

on:
  pull_request:
    branches:
      - a3/importer-ci-base
    paths:
      - "tools/scripture/**"
      - "docs/scripture/**"
      - ".github/workflows/scripture-importer.yml"

permissions:
  contents: read

jobs:
  importer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile importer and tests
        run: python -m py_compile tools/scripture/scripture_importer.py tools/scripture/test_scripture_importer.py
      - name: Run importer unit tests
        run: python -m unittest discover -s tools/scripture -p "test_*.py" -v
