name: Backend authentication foundation verification

on:
  push:
    branches: [feat/auth-a3-backend-foundation]
    paths:
      - 'backend/**'
      - 'docs/authentication/A3_BACKEND_FOUNDATION_2026-11-09.md'
      - '.github/workflows/backend-auth-verification.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/authentication/A3_BACKEND_FOUNDATION_2026-11-09.md'
      - '.github/workflows/backend-auth-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-auth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend package and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Run backend tests
        run: python -m pytest
