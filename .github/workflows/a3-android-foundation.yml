name: A3 Android foundation verification
on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/a3-android-foundation.yml'
  push:
    branches:
      - reconcile/a3-android-foundation-on-main
      - feat/a3-offline-study-foundation-2026-11-12
      - feat/a3-final-hardening-2026-11-13
      - integration/unified-ui-a3-2026-11-13
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/a3-android-foundation.yml'
permissions:
  contents: read
jobs:
  android-foundation:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm is unavailable; emulator will run without hardware acceleration"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Android unit tests and assemble debug APK
        run: ./gradlew --no-daemon --max-workers=2 --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Run SQLite persistence, restart and backup instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          script: ./gradlew --no-daemon --max-workers=2 --console=plain :app:connectedDebugAndroidTest
      - name: Upload debug APK and Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maale-bible-android-debug-and-test-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
