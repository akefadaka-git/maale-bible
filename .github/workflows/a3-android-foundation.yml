name: A3 Android foundation verification
on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/a3-android-foundation.yml'
  push:
    branches:
      - reconcile/a3-android-foundation-on-main
      - feat/a3-offline-study-foundation-2026-11-12
      - feat/a3-final-hardening-2026-11-13
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/a3-android-foundation.yml'
permissions:
  contents: read
jobs:
  android-foundation:
    # Ubuntu 22.04 avoids the observed Ubuntu 24.04 emulator boot timeout
    # on this runner/action combination; app build and test scope is unchanged.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Android unit tests and assemble debug APK
        run: ./gradlew --no-daemon --max-workers=2 --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Enable KVM for Android emulator
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM device /dev/kvm is unavailable on this runner"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Run SQLite persistence, restart and backup instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          disable-linux-hardware-acceleration: false
          script: ./gradlew --no-daemon --max-workers=2 --console=plain :app:connectedDebugAndroidTest
