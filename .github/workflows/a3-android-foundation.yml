name: A3 Android foundation verification
on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/a3-android-foundation.yml'
  push:
    branches:
      - reconcile/a3-android-foundation-on-main
      - feat/a3-offline-study-foundation-2026-11-12
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/a3-android-foundation.yml'
permissions:
  contents: read
jobs:
  android-foundation:
    # Keep the known-stable runner image and allow a full emulator cold boot
    # plus instrumentation without the previous 50-minute cancellation window.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Android unit tests and assemble debug APK
        run: ./gradlew --no-daemon --max-workers=2 --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Run SQLite persistence, restart and backup instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon --max-workers=2 --console=plain --stacktrace :app:connectedDebugAndroidTest
