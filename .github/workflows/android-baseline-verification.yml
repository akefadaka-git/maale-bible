name: Android baseline verification

on:
  pull_request:
    paths:
      - 'app/src/main/java/org/maale/bible/ui/**'
      - '.github/workflows/android-baseline-verification.yml'
  push:
    branches: [fix/android-baseline-kotlin-compilation]
    paths:
      - 'app/src/main/java/org/maale/bible/ui/**'
      - '.github/workflows/android-baseline-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-host-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile and run Android host unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
