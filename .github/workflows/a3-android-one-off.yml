name: A3 Android verification (one-off)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/a3-android-one-off.yml

permissions:
  contents: read

concurrency:
  group: maale-bible-a3-android-verification
  cancel-in-progress: false

jobs:
  verify-approved-a3-sha:
    name: Verify approved A3 source and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout approved A3 commit
        uses: actions/checkout@v4
        with:
          ref: fcb1d04d7a227bfda320cd18a06b12fbd37e4b6d
          persist-credentials: false

      - name: Enforce immutable source SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="fcb1d04d7a227bfda320cd18a06b12fbd37e4b6d"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "Verified source SHA: $actual"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Inspect available Android SDK platforms and install required packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list > /tmp/android-sdk-packages.txt
          grep -E 'platforms;android-[0-9]+' /tmp/android-sdk-packages.txt | head -30
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Gradle wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -F 'gradle-9.5.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Run unit tests and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maale-bible-a3-debug-fcb1d04d
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
