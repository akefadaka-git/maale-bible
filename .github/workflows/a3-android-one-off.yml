name: A3 Android verification (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maale-bible-a3-android-verification
  cancel-in-progress: false

jobs:
  verify-approved-a3-sha:
    name: Verify approved A3 source and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout approved A3 commit
        uses: actions/checkout@v4
        with:
          ref: 7524e6ab4419defa6b111100e0fd2d7d4d14963a
          persist-credentials: false

      - name: Enforce immutable source SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="7524e6ab4419defa6b111100e0fd2d7d4d14963a"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "Verified source SHA: $actual"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 platform and build tools
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Verify Gradle wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -F 'gradle-9.6.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Run unit tests and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maale-bible-a3-debug-7524e6ab
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
